<table width="100%" cellpadding="0" cellspacing="0" style="font-family:Arial,Helvetica,sans-serif; background:#ffffff; color:#111;">
  <tr>
    <td align="center" style="padding:18px 8px;">
      <table width="720" cellpadding="0" cellspacing="0" style="border:1px solid #ddd; border-collapse:collapse;">
        <tr>
          <td style="padding:14px 16px; border-bottom:1px solid #ddd;">
            <div style="font-size:18px; font-weight:bold;">{{FORM_TITLE}}</div>
            <div style="font-size:12px; color:#555; margin-top:4px;">Submitted: {{SUBMITTED_AT}}</div>
            {{ORG_BLOCK}}
          </td>
        </tr>
        <tr>
          <td style="padding:14px 16px;">
            {{CONTENT}}
          </td>
        </tr>
        <tr>
          <td style="padding:10px 16px; border-top:1px solid #eee; font-size:11px; color:#666;">
            This email was generated automatically from the GRASP online form submission.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
