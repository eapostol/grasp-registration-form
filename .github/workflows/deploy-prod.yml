name: Deploy Main to WHC Prod

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install WHC known_hosts
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.WHC_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test TCP connectivity to WHC SSH
        run: |
          timeout 5 bash -lc 'cat < /dev/null > /dev/tcp/${{ secrets.WHC_HOST }}/${{ secrets.WHC_PORT }}'

      - name: Deploy to WHC over one verified SSH connection
        env:
          WHC_HOST: ${{ secrets.WHC_HOST }}
          WHC_PORT: ${{ secrets.WHC_PORT }}
          WHC_USER: ${{ secrets.WHC_USER }}
          WHC_SSH_KEY: ${{ secrets.WHC_SSH_KEY }}
        run: bash scripts/deploy_whc_ci.sh prod main
